name: ✨ 功能请求
 description: 建议新功能或改进
 title: '[Feature]: '
 labels: ['enhancement', 'needs-triage']
 body:
   - type: markdown
     attributes:
       value: |
         感谢您为项目提出新功能！请详细描述您的想法，帮助我们理解您的需求。

   - type: checkboxes
     id: prerequisites
     attributes:
       label: 前提条件
       description: 在提交功能请求之前，请确认以下事项
       options:
         - label: 我已经搜索了现有的 issues，确认这不是重复请求
           required: true
         - label: 我已经考虑了该功能的可行性和必要性
           required: true
         - label: 我理解这可能需要时间和资源来实现
           required: true

   - type: textarea
     id: problem
     attributes:
       label: 相关问题
       description: 这个功能请求是否与某个问题相关？请描述
       placeholder: 如果是，请描述现有问题...

   - type: textarea
     id: solution
     attributes:
       label: 期望的解决方案
       description: 清晰简洁地描述您期望的功能
       placeholder: 请详细描述您希望实现的功能...
     validations:
       required: true

   - type: textarea
     id: alternatives
     attributes:
       label: 替代方案
       description: 描述您考虑过的其他替代方案
       placeholder: |
         1. 替代方案 A...
         2. 替代方案 B...
         3. ...

   - type: textarea
     id: use-cases
     attributes:
       label: 使用场景
       description: 描述这个功能的使用场景
       placeholder: |
         1. 当用户需要...时
         2. 在...情况下
         3. 为了...目的
     validations:
       required: true

   - type: textarea
     id: benefits
     attributes:
       label: 预期收益
       description: 描述这个功能带来的好处
       placeholder: |
         - 提高效率
         - 改善用户体验
         - 降低学习成本
         - 其他...

   - type: dropdown
     id: priority
     attributes:
       label: 优先级
       description: 您认为这个功能的重要程度
       options:
         - 低 - 有更好，没有也可以
         - 中 - 会改善使用体验
         - - 高 - 严重影响使用
         - 紧急 - 必须尽快实现
     validations:
       required: true

   - type: checkboxes
     id: scope
     attributes:
       label: 功能范围
       description: 这个功能可能影响的范围
       options:
         - label: CLI 命令
         - label: 配置文件
         - label: 插件系统
         - label: 技能市场
         - label: 用户界面
         - label: API 接口
         - label: 文档
         - label: 其他

   - type: textarea
     id: implementation
     attributes:
       label: 实现建议
       description: 如果您有实现思路，请分享
       placeholder: |
         技术实现建议：
         - 可能用到的技术栈
         - 架构设计思路
         - 关键实现要点

   - type: textarea
     id: mockup
     attributes:
       label: 界面设计
       description: 如果涉及界面，请描述或提供设计
       placeholder: |
         界面设计描述：
         - 布局设计
         - 交互流程
         - 视觉元素

   - type: textarea
     id: additional
     attributes:
       label: 附加信息
       description: 提供任何其他相关信息
       placeholder: 任何其他有助于理解需求的信息...

   - type: checkboxes
     id: volunteer
     attributes:
       label: 参与开发
       description: 您是否愿意参与开发这个功能？
       options:
         - label: 我愿意提交 PR 来实现这个功能
           required: false
         - label: 我可以提供测试帮助
           required: false
         - label: 我可以提供设计支持
           required: false