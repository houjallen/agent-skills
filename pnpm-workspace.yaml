onlyBuiltDependencies:
  - esbuild

# pnpm 8.10+ 在 deps drift 时会要求 TTY 确认以 purge modules dir；
# 在 CI / 自动化环境下没有 TTY 会 abort commit hook。
# 设 false 允许自动 purge（CI 默认行为）。
confirmModulesPurge: false

allowBuilds:
  '@parcel/watcher': false
  '@parcel/watcher-win32-x64': false
  '@tree-sitter-grammars/tree-sitter-zig': false
  better-sqlite3: false
  esbuild: true
  koffi: false
  node-pty: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  tree-sitter: false
  tree-sitter-bash: false
  tree-sitter-c: false
  tree-sitter-c-sharp: false
  tree-sitter-cpp: false
  tree-sitter-go: false
  tree-sitter-java: false
  tree-sitter-javascript: false
  tree-sitter-php: false
  tree-sitter-python: false
  tree-sitter-ruby: false
  tree-sitter-rust: false
  tree-sitter-scala: false
  tree-sitter-typescript: false

minimumReleaseAgeExclude:
  - '@easbot/mcp@0.3.14'
  - '@easbot/sdk@0.3.14'
  - '@easbot/skills@0.3.14'
  - '@easbot/terminal@0.3.14'
  - '@easbot/types@0.3.14'
  - '@easbot/utils@0.3.14'

# 自 pnpm v10 起，overrides 必须放在 pnpm-workspace.yaml，package.json 里的 pnpm.overrides 会被忽略并触发 reinstall。
# 用 catalogs 统一管理依赖版本（替代过时的 $xxx 占位符），overrides 引用 'catalog:default'。
catalogs:
  default:
    '@modelcontextprotocol/sdk': ^1.29.0
    '@agentclientprotocol/sdk': ^0.25.0
    '@biomejs/biome': 2.5.5
    '@types/node': ^25.8.0
    esbuild: ^0.28.0

overrides:
  '@modelcontextprotocol/sdk': 'catalog:default'
  '@agentclientprotocol/sdk': 'catalog:default'
  '@biomejs/biome': 'catalog:default'
  '@types/node': 'catalog:default'
  esbuild: 'catalog:default'
